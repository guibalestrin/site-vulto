<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shop · Vulto</title>
<meta name="description" content="Shop da Vulto: peças de drops que já aconteceram, enquanto houver estoque.">
<meta name="theme-color" content="#0f0f0e">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%230f0f0e'/%3E%3Cpath d='M10 14h11l11 26 11-26h11L38 52h-12z' fill='%23f2efe6'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=IBM+Plex+Mono:wght@400;500&family=Schibsted+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/shop/shop.css">
</head>
<body>
<header id="shop-header"></header>

<main id="conteudo" tabindex="-1">
  <div class="s-head">
    <div>
      <p class="mono" style="color:var(--text-2);margin:0 0 12px" id="s-kicker" hidden><a href="/shop">Shop</a></p>
      <h1 id="s-title">Shop</h1>
      <p>Peças de drops que já aconteceram, enquanto houver estoque.</p>
    </div>
  </div>

  <div class="s-tools">
    <nav class="s-cats" aria-label="Categorias" id="s-cats"></nav>
    <button class="s-tool" type="button" id="s-open-filters" aria-haspopup="dialog">Filtrar<span id="s-fcount"></span></button>
    <label class="s-tool"><span class="s-sr">Ordenar por</span><span class="lbl-long" aria-hidden="true" style="color:var(--text-2)">Ordem</span>
      <select id="s-sort">
        <option value="recentes">Mais recentes</option>
        <option value="preco-asc">Menor preço</option>
        <option value="preco-desc">Maior preço</option>
      </select>
    </label>
  </div>

  <div class="s-active" id="s-active" aria-label="Filtros ativos"></div>
  <div class="s-meta-row mono"><span id="s-total" aria-live="polite"></span></div>

  <section class="s-grid" id="s-grid" aria-label="Produtos">
    <div class="s-skel"></div><div class="s-skel"></div><div class="s-skel"></div><div class="s-skel"></div>
  </section>
</main>

<dialog class="s-drawer" id="s-filters" aria-labelledby="s-filters-t">
  <header><h2 id="s-filters-t">Filtrar</h2><button class="s-x" type="button" data-close aria-label="Fechar filtros">×</button></header>
  <form class="body" id="s-filter-form"></form>
  <footer><button class="s-btn ghost" type="button" id="s-clear">Limpar</button><button class="s-btn" type="button" data-close id="s-see">Ver peças</button></footer>
</dialog>

<footer id="shop-footer"></footer>

<script src="/static/shop/data.js"></script>
<script src="/static/shop/core.js"></script>
<script src="/static/shop/catalog.js"></script>
</body>
</html>
